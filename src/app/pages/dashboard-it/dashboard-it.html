<app-it-ticket-workspace #workspace>
  <div workspaceHeader>
    <div class="top-bar">
      <button type="button" (click)="workspace.viewExport()" class="btn-report">
        <i class="fa-solid fa-folder-open"></i>
        <span>Report</span>
      </button>

      <div class="btn-command">
        <button type="button" class="btn-type employeeInfo" (click)="workspace.viewEmployeeInfo()">
          <i class="fa-solid fa-address-card"></i>
          <span>Employee Info</span>
        </button>

        <button type="button" class="btn-type approve-out" (click)="workspace.viewApproveResign()">
          <i class="fa-solid fa-person-walking-arrow-right"></i>
          <span>อนุมัติพนักงานลาออก</span>
        </button>

        <button
          type="button"
          class="btn-type problem"
          (click)="workspace.IS_OPEN_IT_SERVICE.set(2)"
        >
          <i class="fas fa-exclamation-triangle"></i>
          <span>แจ้งปัญหา</span>
        </button>

        <button type="button" class="btn-type repair" (click)="workspace.IS_OPEN_IT_SERVICE.set(1)">
          <i class="fas fa-tools"></i>
          <span>แจ้งซ่อม</span>
        </button>

        <button
          type="button"
          class="btn-type service"
          (click)="workspace.IS_OPEN_IT_SERVICE.set(3)"
        >
          <i class="fas fa-concierge-bell"></i>
          <span>แจ้งขอใช้บริการ</span>
        </button>
      </div>
    </div>

    <app-it-dashboard-summary
      [externalStatus]="workspace.filterStatus"
      (statusChange)="workspace.onStatusChange($event)"
      [summaryData]="workspace.summaryRes()"
    ></app-it-dashboard-summary>
  </div>
</app-it-ticket-workspace>
