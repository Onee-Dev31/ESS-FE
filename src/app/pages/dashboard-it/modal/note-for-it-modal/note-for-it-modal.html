<div class="modal-overlay noteTicket">
  <div class="modal-container">
    <div>
      <header class="top-header-strip">
        <h2>Note for IT</h2>
      </header>
      <div class="content-card">
        @if (isEditing()) {
          <textarea
            class="form-input note"
            placeholder="อธิบายรายละเอียด..."
            [(ngModel)]="noteForm.message"
            autofocus
          ></textarea>
        } @else {
          <div class="note-preview" [class.is-empty]="!noteForm.message.trim()">
            {{ noteForm.message.trim() || 'ยังไม่มี Note for IT' }}
          </div>
        }
      </div>
      <div class="form-actions-footer">
        @if (isEditing()) {
          <button class="btn-back-custom" (click)="cancelEdit()">
            <i class="fas fa-times"></i> ยกเลิก
          </button>
          <button class="btn-save-custom" (click)="save()" [disabled]="!noteForm.message.trim()">
            <i class="fas fa-save"></i> บันทึก
          </button>
        } @else {
          <button class="btn-back-custom" (click)="close()">
            <i class="fas fa-times"></i> ปิด
          </button>
          <button class="btn-save-custom" (click)="edit()">
            <i class="fas fa-pen"></i> แก้ไข
          </button>
        }
      </div>
    </div>
  </div>
</div>

@if (isPreviewModalOpen()) {
  <app-file-preview-modal [files]="previewFiles()" (onClose)="closePreview()">
  </app-file-preview-modal>
}
