<form #denyForm="ngForm" (ngSubmit)="save(denyForm)">
  <app-modal-shell
    title="เหตุผลในการยกเลิก"
    size="sm"
    [padded]="false"
    [showClose]="false"
    [mobileFullscreen]="true"
    (closeModal)="close()"
  >
    <div class="deny-content">
      <textarea
        class="deny-reason"
        name="reason"
        ngModel
        required
        placeholder="อธิบายรายละเอียด..."
      ></textarea>

      @if (denyForm.submitted && denyForm.invalid) {
        <div class="validation-message">กรุณากรอกเหตุผลในการยกเลิก</div>
      }
    </div>

    <div modalFooter>
      <button type="button" class="modal-button" (click)="close()">
        <i class="fas fa-times"></i> ยกเลิก
      </button>
      <button type="submit" class="modal-button primary" [disabled]="denyForm.invalid">
        <i class="fas fa-paper-plane"></i> ยืนยัน
      </button>
    </div>
  </app-modal-shell>
</form>
