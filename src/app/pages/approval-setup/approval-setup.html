<div class="page-wrapper">
  <div class="page-header">
    <div class="page-header__left">
      <h1 class="page-title">
        <i class="fas fa-route"></i>
        ตั้งค่าการอนุมัติ
      </h1>
      <button type="button" class="btn-outline btn-setup" (click)="openSetupModal()">
        <i class="fa-solid fa-code-compare"></i>
        <span class="btn-text">ตั้งค่าลำดับการอนุมัติ</span>
      </button>
    </div>
    <div class="page-header__right">
      <button class="btn-refresh" (click)="refreshCurrentTab()">
        <i class="fas fa-sync-alt"></i>
        รีเฟรช
      </button>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-bar-scroll">
      <button
        type="button"
        class="tab-btn"
        [class.active]="activeTab() === 'department'"
        (click)="setTab('department')"
      >
        <i class="fas fa-building"></i>
        <span class="tab-label">ตั้งค่ารายแผนก</span>
      </button>
      <button
        type="button"
        class="tab-btn"
        [class.active]="activeTab() === 'employee'"
        (click)="setTab('employee')"
      >
        <i class="fas fa-user-shield"></i>
        <span class="tab-label">ตั้งค่ารายบุคคล</span>
      </button>
      <button
        type="button"
        class="tab-btn"
        [class.active]="activeTab() === 'it-paid'"
        (click)="setTab('it-paid')"
      >
        <i class="fas fa-file-invoice-dollar"></i>
        <span class="tab-label">IT แบบมีค่าใช้จ่าย</span>
      </button>
    </div>
  </div>

  @if (activeTab() === 'department') {
    <app-department-setup />
  } @else if (activeTab() === 'employee') {
    <app-employee-setup />
  } @else {
    <app-it-paid-setup />
  }
</div>

@if (isSetupModalOpen()) {
  <app-approval-setup-chain-modal
    (onClose)="closeSetupModal()"
    (onSaved)="departmentSetup()?.refresh()"
  />
}
