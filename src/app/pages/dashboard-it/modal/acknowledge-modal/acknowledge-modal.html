<div class="modal-overlay acknowledgeTicket">
  <div class="modal-container">
    <div>
      <header class="top-header-strip">
        <h2>รับเรื่อง</h2>
      </header>

      <form (ngSubmit)="save()">
        <div class="content-card">
          <div>
            <div>
              <p>เลือกประเภทงาน<span class="required">*</span></p>
            </div>

            <div class="tag-group">
              <label class="tag">
                <input
                  type="radio"
                  name="tag"
                  [value]="2"
                  [(ngModel)]="selectedTag"
                  (ngModelChange)="onTagChange($event)"
                />
                <span>แจ้งปัญหา</span>
              </label>

              <label class="tag">
                <input
                  type="radio"
                  name="tag"
                  [value]="1"
                  [(ngModel)]="selectedTag"
                  (ngModelChange)="onTagChange($event)"
                />
                <span>แจ้งซ่อม</span>
              </label>

              <label class="tag">
                <input
                  type="radio"
                  name="tag"
                  [value]="3"
                  [(ngModel)]="selectedTag"
                  (ngModelChange)="onTagChange($event)"
                />
                <span>ขอใช้บริการ</span>
              </label>
            </div>
          </div>

          <div *ngIf="isTagChanged" style="margin: 10px; margin-top: 20px">
            <label class="reason-label" for="acknowledge-reason">
              เหตุผล <span>(ไม่บังคับ)</span>
            </label>
            <textarea
              id="acknowledge-reason"
              name="message"
              class="form-input note"
              placeholder="กรอกเหตุผลในการเปลี่ยนประเภทคำขอ..."
              [(ngModel)]="message"
            ></textarea>
          </div>
        </div>

        <div class="form-actions-footer">
          <button type="button" class="btn-back-custom" (click)="close()">
            <i class="fas fa-times"></i> ยกเลิก
          </button>

          <button type="submit" class="btn-save-custom" [disabled]="!selectedTag">
            <i class="fas fa-paper-plane"></i> ยืนยัน
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
