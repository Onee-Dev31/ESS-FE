<div class="modal-overlay">
  <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="close-ticket-title">
    <header class="modal-header">
      <div>
        <h2 id="close-ticket-title">ปิดงาน</h2>
        <p>{{ ticket?.ticketNumber }} · {{ ticket?.subject || ticket?.requesterName }}</p>
      </div>
      <button
        type="button"
        class="btn-close"
        [disabled]="isSubmitting()"
        (click)="close()"
        aria-label="ปิด"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </header>
    <div class="modal-body">
      <label>เหตุผลในการปิดงาน <span>*</span></label>
      <app-message-composer
        [(message)]="reason"
        [busy]="isSubmitting()"
        placeholder="กรอกเหตุผลในการปิดงาน..."
      />
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn-cancel" [disabled]="isSubmitting()" (click)="close()">
        ยกเลิก
      </button>
      <button
        type="button"
        class="btn-submit"
        [disabled]="!hasReason || isSubmitting()"
        (click)="submit()"
      >
        {{ isSubmitting() ? 'กำลังเตรียมรูปภาพ...' : 'ปิดงาน' }}
      </button>
    </footer>
  </div>
</div>
