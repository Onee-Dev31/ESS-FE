<div class="tk-page" *ngIf="selectedTicket() as t">
  <main class="tk-center">
    <app-ticket-detail-card
      [ticket]="t"
      audience="it"
      [serviceLimit]="3"
      (attachmentClick)="openAttachmentManager()"
    />

    <app-ticket-attachment-manager
      *ngIf="isAttachmentManagerOpen()"
      [userFiles]="t.attachments"
      [itFiles]="t.itAttachments ?? []"
      (onViewFile)="viewManagedAttachment($event)"
      (onClose)="closeAttachmentManager()"
    />

    <section class="tk-card reason" *ngIf="t.status === 'Denied' && t.rejection_reason">
      <div class="tk-card__head"><div class="tk-card__title">เหตุผลในการไม่อนุมัติ</div></div>
      <div class="tk-card__body">
        <div class="tk-text html-detail" [innerHTML]="t.rejection_reason"></div>
      </div>
    </section>

    <section class="tk-actions" *ngIf="t.status !== 'Closed' && t.status !== 'Denied'">
      <div class="btn-group">
        <button class="btn btn-onhold" (click)="resumeTicket()" *ngIf="t.status === 'Hold'">
          <i class="fa-solid fa-play btn-action-icon"></i> Resume
        </button>
        <button class="btn btn-onhold" (click)="onHoldTicket()" *ngIf="t.status !== 'Hold'">
          <i class="fa-solid fa-pause btn-action-icon"></i> On Hold
        </button>
        <button class="btn btn-deny" (click)="openDenyModal()" *ngIf="t.status !== 'Hold'">
          <i class="fa-solid fa-ban btn-action-icon"></i> Deny
        </button>
      </div>
      <div class="btn-group" *ngIf="t.status !== 'Hold'">
        <button
          class="btn btn-accept"
          (click)="openAcknowledgeModal()"
          *ngIf="t.status !== 'In Progress' && t.status !== 'Assigned'"
        >
          <i class="fa-solid fa-tag btn-action-icon"></i> รับเรื่อง
        </button>
        <button class="btn btn-send" (click)="openAssignModal()">
          <i class="fa-solid fa-share btn-action-icon"></i> ส่งต่อ
        </button>
        <button class="btn btn-done" (click)="closeTicket()">
          <i class="fa-solid fa-circle-check btn-action-icon"></i> ปิดงาน
        </button>
      </div>
    </section>
  </main>

  <aside class="tk-right">
    <app-ticket-requester-card *ngIf="t.requester" [requester]="t.requester" />
    <app-ticket-progress-card [ticket]="t" audience="it" />
  </aside>

  <app-ticket-chat
    [ticket]="t"
    [visible]="true"
    [isOpen]="IS_CHAT_OPEN()"
    [canSend]="false"
    mode="it-dashboard"
    (toggle)="IS_CHAT_OPEN.set(!IS_CHAT_OPEN())"
    (close)="IS_CHAT_OPEN.set(false)"
    (attachmentView)="viewFile($event)"
  />

  @if (isPreviewModalOpen()) {
    <app-file-preview-modal [files]="previewFiles()" (onClose)="closePreview()" />
  }
</div>

@if (IS_NOTE_TICKET()) {
  <app-note-modal [ticket]="selectedTicket()" (closeModal)="closeAddNoteModal()" />
}
@if (IS_HOLD_TICKET()) {
  <app-deny-modal
    [ticket]="selectedTicket()"
      title="เหตุผลในการหยุดชั่วคราว (On Hold)"
      [reasonRequired]="false"
    placeholder="กรอกเหตุผลในการหยุดชั่วคราว..."
    validationMessage="กรุณากรอกเหตุผลในการหยุดชั่วคราว"
    (closeModal)="closeHoldModal()"
    (submitModal)="submitHold($event)"
  />
}

@if (IS_DENY_TICKET()) {
  <app-deny-modal
    [ticket]="selectedTicket()"
    (closeModal)="closeDenyModal()"
    (submitModal)="submitDeny($event)"
  />
}
@if (IS_ACKNOWLEDGE_TICKET()) {
  <app-acknowledge-modal
    [ticket]="selectedTicket()"
    (closeModal)="closeAcknowledgeModal()"
    (submitModal)="submitAcknowledge($event)"
  />
}
@if (IS_ASSIGN_TICKET()) {
  <app-assign-modal
    [assigneeGroups]="assigneeGroups"
    [ticket]="selectedTicket()"
    (closeModal)="closeAssignModal()"
    (submitModal)="submitAssign($event)"
  />
}
