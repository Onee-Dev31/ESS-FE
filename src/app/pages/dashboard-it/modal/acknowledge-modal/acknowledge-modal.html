<app-modal-shell
  title="รับเรื่อง"
  size="sm"
  [showClose]="false"
  [mobileFullscreen]="true"
  (closeModal)="close()"
>
  <div class="content-card">
    @if (isApproved) {
      <div class="approved-ticket-type">
        <span>ประเภทงาน</span>
        <strong>{{ ticketTypeLabel }}</strong>
      </div>
    } @else {
      <p>เลือกประเภทงาน<span class="required">*</span></p>
      <div class="tag-group">
        <label class="tag">
          <input
            type="radio"
            name="tag"
            [value]="2"
            [(ngModel)]="selectedTag"
            (ngModelChange)="onTagChange($event)"
          />
          <span>แจ้งปัญหา</span>
        </label>
        <label class="tag">
          <input
            type="radio"
            name="tag"
            [value]="1"
            [(ngModel)]="selectedTag"
            (ngModelChange)="onTagChange($event)"
          />
          <span>แจ้งซ่อม</span>
        </label>
        @if (ticket?.viaEmail === true) {
          <label class="tag">
            <input
              type="radio"
              name="tag"
              [value]="3"
              [(ngModel)]="selectedTag"
              (ngModelChange)="onTagChange($event)"
            />
            <span>ขอใช้บริการ</span>
          </label>
        }
      </div>
    }

    <div class="reason-field">
      <label class="reason-label" for="acknowledge-reason">เหตุผล <span>(ไม่บังคับ)</span></label>
      <textarea
        id="acknowledge-reason"
        name="message"
        class="form-input note"
        placeholder="กรอกเหตุผลในการเปลี่ยนประเภทคำขอ..."
        [(ngModel)]="message"
      ></textarea>
    </div>
  </div>

  <div modalFooter>
    <button type="button" class="modal-button" (click)="close()">
      <i class="fas fa-times"></i> ยกเลิก
    </button>
    <button type="button" class="modal-button primary" [disabled]="!selectedTag" (click)="save()">
      <i class="fas fa-paper-plane"></i> ยืนยัน
    </button>
  </div>
</app-modal-shell>
